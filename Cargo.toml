[package]
name = "unlaw"
version = "3.10.1"
edition = "2021"
rust-version = "1.82"
description = "A small, extensible macOS command launcher"
license = "GPL-3.0-or-later"
authors = ["Haos"]
build = "rust/build.rs"
publish = false

[workspace]
members = ["ule"]

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "ul"
path = "rust/src/bin/ul.rs"

[[bin]]
name = "unlaw"
path = "rust/src/bin/unlaw.rs"

[[bin]]
name = "ula"
path = "rust/src/bin/ula.rs"
required-features = ["agent"]

[[bin]]
name = "unlawagent"
path = "rust/src/bin/unlawagent.rs"
required-features = ["agent"]

# Optional parts chosen at install time (`ul features`); a plain build has all of them.
[features]
default = ["game", "lm", "agent"]
game = []
lm = []
# Only the ula/unlawagent shortcuts; the agent itself is a seeded Python command.
agent = []

[dependencies]
crossterm = { version = "0.28", default-features = false, features = ["events", "bracketed-paste"] }
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
