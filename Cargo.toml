[package]
name = "unlaw"
version = "3.21.0"
edition = "2021"
rust-version = "1.82"
description = "A small, extensible macOS command launcher"
license = "MIT"
authors = ["Haos"]
build = "rust/build.rs"
publish = false

[workspace]
members = ["ule"]

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "ul"
path = "rust/src/bin/ul.rs"

[[bin]]
name = "unlaw"
path = "rust/src/bin/unlaw.rs"

[[bin]]
name = "ula"
path = "rust/src/bin/ula.rs"
required-features = ["agent"]

[[bin]]
name = "unlawagent"
path = "rust/src/bin/unlawagent.rs"
required-features = ["agent"]

[[bin]]
name = "ul-rec"
path = "rust/src/bin/ul-rec.rs"
required-features = ["capture"]

# Optional parts chosen at install time (`ul features`); a plain build has all of them.
[features]
default = ["game", "lm", "agent", "capture"]
game = []
lm = []
# Only the ula/unlawagent shortcuts; the agent itself is a seeded Python command.
agent = []
# Only the ul-rec recording engine (ScreenCaptureKit + AVFoundation); capture itself is a seeded Python command.
capture = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-core-foundation", "dep:objc2-core-media", "dep:objc2-av-foundation", "dep:objc2-screen-capture-kit", "dep:block2"]

[dependencies]
crossterm = { version = "0.28", default-features = false, features = ["events", "bracketed-paste"] }
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }
# ul-rec only (feature `capture`); ul and unlaw never link them.
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-core-foundation = { version = "0.3", optional = true }
objc2-core-media = { version = "0.3", optional = true }
objc2-av-foundation = { version = "0.3", optional = true, features = ["objc2-core-media"] }
objc2-screen-capture-kit = { version = "0.3", optional = true }
block2 = { version = "0.6", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
