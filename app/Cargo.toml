[package]
name = "unlaw-app"
version = "4.0.0"
edition = "2021"
description = "Unlaw.app: menu bar items, global hotkeys and a command palette for ul"
license = "MIT"
authors = ["Haos"]
publish = false

[[bin]]
name = "ul-app"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
libc = "0.2"
serde_json = "1"
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }
# The window shell; only this package links them (ul and ule never do).
tao = "0.37"
wry = "0.57"
tray-icon = "0.26"
global-hotkey = "0.10"
window-vibrancy = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
# Menu bar symbols (SF Symbols) on the status items tray-icon creates.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSData", "NSDictionary", "NSFileManager", "NSURL", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSImage", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSCell", "NSWindow", "NSWorkspace", "NSBitmapImageRep", "NSImageRep", "NSEvent", "block2"] }
