title = "Weather"
icon = "cloud"

[panel]
[[panel.field]]
id = "city"
type = "text"
label = "City"
placeholder = "weather.city from config.toml"

[[panel.field]]
id = "days"
type = "choice"
label = "Days"
options = ["1", "3", "7", "14"]
default = "3"

[[panel.button]]
label = "Show"
args = ["{city}", "--days", "{days}"]
