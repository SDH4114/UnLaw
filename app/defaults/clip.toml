title = "Clipboard"
icon = "clipboard"
# The history as a list in the app: search, click to copy again.
section = "clipboard"

[[action]]
id = "list"
label = "Recent copies"
args = ["list", "10"]

[[action]]
id = "pause"
label = "Pause the history"
args = ["pause"]

[[action]]
id = "resume"
label = "Resume the history"
args = ["resume"]

[panel]
[[panel.field]]
id = "n"
type = "number"
label = "Copy item number"
default = "1"

[[panel.button]]
label = "Copy again"
args = ["copy", "{n}"]

[[panel.button]]
label = "Show"
args = ["show", "{n}"]
