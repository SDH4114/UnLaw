title = "Desk"
icon = "board"
# Shown inside the app's main window; [open] is how the page is served.
section = "board"

[open]
args = ["--no-open"]

[panel]
[[panel.field]]
id = "text"
type = "text"
label = "New card"
required = true
placeholder = "Call the bank @tomorrow"

[[panel.button]]
label = "Add to the board"
args = ["add", "--", "{text}"]
