title = "Awake"
icon = "cup"
# The app draws this panel itself (durations, until a time, screen and lid, schedules).
view = "awake"

[[action]]
id = "1h"
label = "Keep awake 1 h"
args = ["1h"]

[[action]]
id = "2h"
label = "Keep awake 2 h"
args = ["2h"]

[[action]]
id = "on"
label = "Keep awake until stopped"
args = ["on"]

[[action]]
id = "off"
label = "Let the Mac sleep"
args = ["off"]

[panel]
[[panel.field]]
id = "dur"
type = "choice"
label = "For"
options = ["30m", "1h", "2h", "4h", "8h", "on"]
default = "1h"

[[panel.field]]
id = "until"
type = "time"
label = "Or until"
required = true

[[panel.field]]
id = "display"
type = "toggle"
label = "Screen stays on"
default = true

[[panel.field]]
id = "lid"
type = "toggle"
label = "Also with the lid closed"

[[panel.button]]
label = "Start"
args = ["{dur}", "{display?:--no-display}", "{lid?--lid}"]

[[panel.button]]
label = "Until that time"
args = ["until", "{until}", "{display?:--no-display}", "{lid?--lid}"]

[[panel.button]]
label = "Stop"
args = ["off"]

[status]
args = ["status", "--json"]
every = 10
# No text in the menu bar: an empty cup when off, a full steaming cup while awake.
text = ""
when = "active"
otherwise = ""
icon = "cup-hot"
otherwise_icon = "cup"

# Left click on the cup switches it like Caffeine and KeepingYouAwake; right click opens the panel.
[toggle]
start = "on"
stop = "off"
