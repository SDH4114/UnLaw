title = "Timer"
icon = "clock"

[[action]]
id = "list"
label = "Running timers"
args = ["list"]

[[action]]
id = "clock-setup"
label = "Use the Clock app (once)"
args = ["clock", "setup"]

[[action]]
id = "cancel-all"
label = "Cancel every timer"
args = ["cancel", "--all"]
confirm = "Cancel every running timer?"

[panel]
[[panel.field]]
id = "dur"
required = true
type = "duration"
label = "Timer for"
default = "25m"

[[panel.field]]
id = "at"
required = true
type = "time"
label = "Alarm at"

[[panel.field]]
id = "label"
type = "text"
label = "Label"
placeholder = "Tea"

[[panel.field]]
id = "clock"
type = "toggle"
label = "In the Clock app (rings with its sound)"
default = true

[[panel.button]]
label = "Start timer"
args = ["{dur}", "{label}", "{clock?--clock}"]

[[panel.button]]
label = "Set alarm"
args = ["at", "{at}", "{label}", "{clock?--clock}"]
