# The `ul`/`unlaw` executables are built from Cargo.toml (Rust core). This
# package holds the Python sources of the seeded commands, which the Rust
# build embeds and the unit tests import.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unlaw"
version = "3.10.4"
description = "Seeded command sources for the Unlaw macOS command launcher"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Haos" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/unlawful"]

[tool.hatch.build]
include = [
  "src/unlawful/**/*.py",
]
