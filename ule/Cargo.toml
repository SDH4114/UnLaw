[package]
name = "ule"
version = "4.0.0"
edition = "2021"
rust-version = "1.82"
description = "Unlaw's modal code editor: vim keys, LSP, fuzzy pickers and ul built in"
license = "MIT"
authors = ["Haos"]
publish = false

[[bin]]
name = "ule"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# use-dev-tty: crossterm's other unix event source (poll + read). The default (mio) one spins
# forever on a closed terminal, so a full-screen program never returned to notice it.
crossterm = { version = "0.28", default-features = false, features = ["events", "bracketed-paste", "use-dev-tty"] }
libc = "0.2"
regex = "1"
serde_json = "1"
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }
unicode-width = "0.2"
