[package]
name = "ule"
version = "3.6.0"
edition = "2021"
rust-version = "1.82"
description = "Unlaw's modal code editor: vim keys, LSP, fuzzy pickers and ul built in"
license = "GPL-3.0-or-later"
authors = ["Haos"]
publish = false

[[bin]]
name = "ule"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
crossterm = { version = "0.28", default-features = false, features = ["events", "bracketed-paste"] }
libc = "0.2"
regex = "1"
serde_json = "1"
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }
unicode-width = "0.2"
