# Built-in themes. A value is a color (fg) or a table:
#   { fg = "...", bg = "...", modifiers = ["bold", "italic", "underline", "undercurl", "reverse", "dim", "crossed"], underline = "color" }
# Colors: palette names, "#rrggbb", ANSI names (red, bright_blue, ...), 0-255, or "default".
# Keys fall back from specific to general: "syntax.keyword.control" -> "syntax.keyword".

# Follows the terminal's own 16 colors, so it matches the Ghostty theme.
[unlaw]
"ui.text" = "default"
"ui.cursorline" = { bg = 236 }
"ui.selection" = { bg = 239 }
"ui.linenr" = "bright_black"
"ui.linenr.current" = { fg = "yellow", modifiers = ["bold"] }
"ui.statusline" = { fg = "white", bg = 236 }
"ui.statusline.inactive" = { fg = "bright_black", bg = 235 }
"ui.mode.normal" = { fg = "black", bg = "blue", modifiers = ["bold"] }
"ui.mode.insert" = { fg = "black", bg = "green", modifiers = ["bold"] }
"ui.mode.visual" = { fg = "black", bg = "magenta", modifiers = ["bold"] }
"ui.mode.command" = { fg = "black", bg = "yellow", modifiers = ["bold"] }
"ui.mode.replace" = { fg = "black", bg = "red", modifiers = ["bold"] }
"ui.popup" = { bg = 235 }
"ui.popup.selected" = { bg = 239, modifiers = ["bold"] }
"ui.popup.border" = "bright_black"
"ui.popup.match" = { fg = "yellow", modifiers = ["bold"] }
"ui.popup.title" = { fg = "cyan", modifiers = ["bold"] }
"ui.search" = { fg = "black", bg = "yellow" }
"ui.search.current" = { fg = "black", bg = "bright_yellow", modifiers = ["bold"] }
"ui.bracket" = { bg = 240, modifiers = ["bold"] }
"ui.indent_guide" = 237
"ui.whitespace" = 239
"ui.ruler" = { bg = 235 }
"ui.bufferline" = { fg = "bright_black", bg = 235 }
"ui.bufferline.active" = { fg = "white", bg = 238, modifiers = ["bold"] }
"ui.separator" = "bright_black"
"ui.message.error" = { fg = "red", modifiers = ["bold"] }
"ui.message.warning" = "yellow"
"ui.message.info" = "cyan"
"ui.virtual" = "bright_black"
"ui.dashboard.logo" = { fg = "cyan", modifiers = ["bold"] }
"ui.dashboard.key" = { fg = "yellow", modifiers = ["bold"] }
"ui.explorer.dir" = { fg = "blue", modifiers = ["bold"] }
"ui.hint" = "bright_black"
"diag.error" = "red"
"diag.warning" = "yellow"
"diag.info" = "blue"
"diag.hint" = "cyan"
"syntax.comment" = { fg = "bright_black", modifiers = ["italic"] }
"syntax.keyword" = "magenta"
"syntax.type" = "yellow"
"syntax.function" = "blue"
"syntax.macro" = "cyan"
"syntax.string" = "green"
"syntax.escape" = "cyan"
"syntax.number" = "red"
"syntax.constant" = "red"
"syntax.operator" = "white"
"syntax.punctuation" = "bright_black"
"syntax.attribute" = "cyan"
"syntax.property" = "bright_white"
"syntax.label" = "cyan"
"syntax.tag" = "red"
"syntax.heading" = { fg = "blue", modifiers = ["bold"] }
"syntax.bold" = { modifiers = ["bold"] }
"syntax.italic" = { modifiers = ["italic"] }
"syntax.link" = { fg = "cyan", modifiers = ["underline"] }
"syntax.code" = "green"
"syntax.list" = "yellow"
"syntax.quote" = { fg = "bright_black", modifiers = ["italic"] }
"syntax.diff.plus" = "green"
"syntax.diff.minus" = "red"
"syntax.diff.delta" = "yellow"

