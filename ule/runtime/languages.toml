# Built-in languages. Any key can be overridden, and new languages added, in
# ule.toml under [languages.<name>].
#
# extensions / filenames / shebangs  detection
# comment, block_comment             what `gc` toggles; also highlighting
# keywords, types, constants, builtins  highlighted words
# strings, multiline_strings         string delimiters (single line unless listed as multiline)
# lsp = [["server", "args"], ...]    first one found on PATH is started
# roots                              files that mark the project root for the LSP
# formatter = ["cmd", "args"]        reads stdin, writes stdout; {file} is the path
# formatter_configs                  with format_on_save = "auto", format only when one exists in the project
# run                                `<space>r` / :run; {file}, {dir}, {stem} are filled in
# indent                             one indent unit ("    " or "\t"); tab_width and wrap may be set too

[rust]
extensions = ["rs"]
comment = "//"
block_comment = ["/*", "*/"]
nested_comments = true
keywords = ["as", "async", "await", "break", "const", "continue", "crate", "dyn", "else", "enum", "extern", "fn", "for", "if", "impl", "in", "let", "loop", "match", "mod", "move", "mut", "pub", "ref", "return", "self", "Self", "static", "struct", "super", "trait", "type", "union", "unsafe", "use", "where", "while", "yield", "macro_rules"]
types = ["bool", "char", "str", "u8", "u16", "u32", "u64", "u128", "usize", "i8", "i16", "i32", "i64", "i128", "isize", "f32", "f64", "String", "Vec", "Option", "Result", "Box", "Rc", "Arc", "HashMap", "HashSet", "BTreeMap", "BTreeSet", "VecDeque"]
constants = ["true", "false", "None", "Some", "Ok", "Err"]
strings = ['"']
multiline_strings = ['"']
raw_strings = true
lifetimes = true
macros = true
attributes = "#["
capitalized_types = true
indent = "    "
lsp = [["rust-analyzer"]]
roots = ["Cargo.toml"]
formatter = ["rustfmt", "--edition", "2021", "--emit", "stdout"]
formatter_configs = ["rustfmt.toml", ".rustfmt.toml"]
run = "cargo run"

[python]
extensions = ["py", "pyi", "pyw"]
shebangs = ["python", "python3"]
filenames = ["SConstruct"]
comment = "#"
keywords = ["and", "as", "assert", "async", "await", "break", "class", "continue", "def", "del", "elif", "else", "except", "finally", "for", "from", "global", "if", "import", "in", "is", "lambda", "match", "case", "nonlocal", "not", "or", "pass", "raise", "return", "try", "while", "with", "yield", "self", "cls"]
types = ["int", "float", "str", "bytes", "bool", "list", "dict", "set", "tuple", "object", "type", "complex", "frozenset", "bytearray"]
constants = ["True", "False", "None", "NotImplemented", "Ellipsis", "__name__", "__file__"]
builtins = ["print", "len", "range", "open", "enumerate", "zip", "map", "filter", "sorted", "reversed", "isinstance", "issubclass", "getattr", "setattr", "hasattr", "super", "min", "max", "sum", "abs", "any", "all", "repr", "input", "iter", "next", "id", "hash", "round", "vars", "dir", "help", "format", "chr", "ord"]
strings = ['"', "'"]
multiline_strings = ['"""', "'''"]
string_prefixes = "rbfuRBFU"
decorators = true
capitalized_types = true
indent = "    "
indent_after = [":"]
lsp = [["basedpyright-langserver", "--stdio"], ["pyright-langserver", "--stdio"], ["pylsp"], ["jedi-language-server"], ["ruff", "server"]]
roots = ["pyproject.toml", "setup.py", "requirements.txt"]
formatter = ["ruff", "format", "--stdin-filename", "{file}", "-"]
formatter_configs = ["ruff.toml", ".ruff.toml"]
run = "python3 {file}"

[c]
extensions = ["c", "h"]
comment = "//"
block_comment = ["/*", "*/"]
keywords = ["auto", "break", "case", "const", "continue", "default", "do", "else", "enum", "extern", "for", "goto", "if", "inline", "register", "restrict", "return", "sizeof", "static", "struct", "switch", "typedef", "union", "volatile", "while", "_Generic", "_Static_assert"]
types = ["char", "double", "float", "int", "long", "short", "signed", "unsigned", "void", "bool", "size_t", "ssize_t", "int8_t", "int16_t", "int32_t", "int64_t", "uint8_t", "uint16_t", "uint32_t", "uint64_t", "FILE"]
constants = ["NULL", "true", "false", "EOF"]
strings = ['"']
char_quote = "'"
preprocessor = "#"
indent = "    "
lsp = [["clangd"]]
roots = ["compile_commands.json", "CMakeLists.txt", "Makefile"]
formatter = ["clang-format", "--assume-filename={file}"]
formatter_configs = [".clang-format", "_clang-format"]
run = "cc {file} -o /tmp/{stem} && /tmp/{stem}"

[cpp]
extensions = ["cpp", "cc", "cxx", "hpp", "hh", "hxx", "ipp", "tpp", "cppm"]
comment = "//"
block_comment = ["/*", "*/"]
keywords = ["alignas", "alignof", "auto", "break", "case", "catch", "class", "const", "consteval", "constexpr", "constinit", "const_cast", "continue", "co_await", "co_return", "co_yield", "decltype", "default", "delete", "do", "dynamic_cast", "else", "enum", "explicit", "export", "extern", "final", "for", "friend", "goto", "if", "import", "inline", "module", "mutable", "namespace", "new", "noexcept", "operator", "override", "private", "protected", "public", "reinterpret_cast", "requires", "return", "sizeof", "static", "static_assert", "static_cast", "struct", "switch", "template", "this", "throw", "try", "typedef", "typeid", "typename", "union", "using", "virtual", "volatile", "while", "concept"]
types = ["bool", "char", "char8_t", "char16_t", "char32_t", "double", "float", "int", "long", "short", "signed", "unsigned", "void", "wchar_t", "size_t", "string", "string_view", "vector", "map", "unordered_map", "set", "unique_ptr", "shared_ptr", "optional", "variant", "array", "span", "int32_t", "int64_t", "uint8_t", "uint32_t", "uint64_t"]
constants = ["nullptr", "true", "false", "NULL"]
strings = ['"']
char_quote = "'"
preprocessor = "#"
capitalized_types = true
indent = "    "
lsp = [["clangd"]]
roots = ["compile_commands.json", "CMakeLists.txt", "Makefile"]
formatter = ["clang-format", "--assume-filename={file}"]
formatter_configs = [".clang-format", "_clang-format"]
run = "c++ -std=c++23 {file} -o /tmp/{stem} && /tmp/{stem}"

[javascript]
extensions = ["js", "mjs", "cjs", "jsx"]
shebangs = ["node"]
comment = "//"
block_comment = ["/*", "*/"]
keywords = ["async", "await", "break", "case", "catch", "class", "const", "continue", "debugger", "default", "delete", "do", "else", "export", "extends", "finally", "for", "from", "function", "get", "if", "import", "in", "instanceof", "let", "new", "of", "return", "set", "static", "super", "switch", "this", "throw", "try", "typeof", "var", "void", "while", "with", "yield"]
constants = ["true", "false", "null", "undefined", "NaN", "Infinity"]
builtins = ["console", "window", "document", "require", "module", "process", "JSON", "Math", "Promise", "Array", "Object", "String", "Number", "Map", "Set"]
strings = ['"', "'", "`"]
multiline_strings = ["`"]
capitalized_types = true
indent = "  "
lsp = [["typescript-language-server", "--stdio"]]
roots = ["package.json", "jsconfig.json"]
formatter = ["prettier", "--stdin-filepath", "{file}"]
formatter_configs = [".prettierrc", ".prettierrc.json", "prettier.config.js", ".prettierrc.js"]
