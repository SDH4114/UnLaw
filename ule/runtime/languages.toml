keywords = ["abstract", "as", "async", "await", "break", "case", "catch", "class", "const", "continue", "declare", "default", "delete", "do", "else", "enum", "export", "extends", "finally", "for", "from", "function", "get", "if", "implements", "import", "in", "infer", "instanceof", "interface", "keyof", "let", "namespace", "new", "of", "private", "protected", "public", "readonly", "return", "satisfies", "set", "static", "super", "switch", "this", "throw", "try", "type", "typeof", "var", "void", "while", "yield"]
types = ["string", "number", "boolean", "any", "unknown", "never", "object", "void", "bigint", "symbol", "Record", "Partial", "Readonly", "Promise", "Array"]
roots = ["package.json", "tsconfig.json"]
